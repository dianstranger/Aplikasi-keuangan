<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Keuangan Futuristik</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-md mx-auto bg-slate-900 border border-cyan-500/30 rounded-2xl p-6 shadow-[0_0_20px_rgba(6,182,212,0.15)]">
        <h1 class="text-2xl font-bold text-center text-cyan-400 mb-6 tracking-wide">FINANCE DASHBOARD</h1>
        
        <!-- Ringkasan Saldo -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 mb-6">
            <p class="text-xs text-slate-400 uppercase tracking-wider">Total Saldo</p>
            <h2 id="total-saldo" class="text-3xl font-extrabold text-emerald-400 my-1">Rp 0</h2>
        </div>

        <!-- Form Input -->
        <form id="form-transaksi" class="space-y-4 mb-6">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Keterangan</label>
                <input type="text" id="deskripsi" placeholder="Contoh: Gaji, Makanan" required 
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Jumlah (Rp)</label>
                <input type="number" id="jumlah" placeholder="100000" required 
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="tambahTransaksi('pemasukan')" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                    + Pemasukan
                </button>
                <button type="button" onclick="tambahTransaksi('pengeluaran')" 
                    class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                    - Pengeluaran
                </button>
            </div>
        </form>

        <!-- Riwayat -->
        <h3 class="text-sm font-semibold text-slate-300 mb-3">Riwayat Transaksi</h3>
        <ul id="daftar-transaksi" class="space-y-2 max-h-48 overflow-y-auto">
            <li class="text-xs text-slate-500 text-center py-2">Belum ada transaksi</li>
        </ul>
    </div>

    <script>
        let saldo = 0;
        function tambahTransaksi(tipe) {
            const deskripsi = document.getElementById('deskripsi').value;
            const jumlahInput = document.getElementById('jumlah').value;
            const jumlah = parseFloat(jumlahInput);

            if(!deskripsi || isNaN(jumlah) || jumlah <= 0) return alert('Mohon isi data dengan benar');

            const list = document.getElementById('daftar-transaksi');
            if(list.children[0]?.classList.contains('text-slate-500')) list.innerHTML = '';

            if(tipe === 'pemasukan') saldo += jumlah;
            else saldo -= jumlah;

            document.getElementById('total-saldo').innerText = 'Rp ' + saldo.toLocaleString('id-ID');

            const li = document.createElement('li');
            li.className = `flex justify-between items-center p-3 rounded-lg text-xs bg-slate-800 border-l-4 ${tipe === 'pemasukan' ? 'border-emerald-500' : 'border-rose-500'}`;
            li.innerHTML = `<span>${deskripsi}</span> <span class="font-bold">${tipe === 'pemasukan' ? '+' : '-'} Rp ${jumlah.toLocaleString('id-ID')}</span>`;
            list.prepend(li);

            document.getElementById('deskripsi').value = '';
            document.getElementById('jumlah').value = '';
            }
    </script>
</body>
</html>
